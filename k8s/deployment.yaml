apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-ai
spec:
  replicas: 2
  selector:
    matchLabels: { app: orbit-ai }
  template:
    metadata:
      labels: { app: orbit-ai }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: orbit-ai
          image: orbit-ai:latest
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: ANTHROPIC_MODEL, value: claude-opus-5-5 }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: orbit-ai-secrets, key: ANTHROPIC_API_KEY }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata:
  name: orbit-ai
spec:
  selector: { app: orbit-ai }
  ports:
    - { name: http, port: 80, targetPort: http }
